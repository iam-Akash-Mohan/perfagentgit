[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senapathy"
version = "0.0.0"
description = "Autonomous performance-bottleneck agent for Spring Boot endpoints"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "python-ulid",
    "numpy",
    "scipy",
    "pyyaml",
    "mysql-connector-python",
    "python-dotenv",
    # find_route parses controllers with a real parser, not a regex.
    "tree-sitter>=0.21",
    "tree-sitter-java>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "types-PyYAML",
]

[project.scripts]
senapathy = "senapathy.cli:app"

[tool.setuptools.packages.find]
include = ["senapathy*"]

# No package-data. The glob here existed to ship
# `senapathy/measure/corpus.json` -- 12 hand-written requests against one
# endpoint of one repo, used as the DEFAULT corpus for every run. A corpus
# is per-run evidence and now lives in the run directory.

[tool.pytest.ini_options]
testpaths = ["tests"]
