[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfagent"
version = "0.0.0"
description = "Autonomous performance-bottleneck agent for Spring Boot endpoints"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "python-ulid",
    "numpy",
    "scipy",
    "pyyaml",
    "mysql-connector-python",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
perfagent = "perfagent.cli:app"

[tool.setuptools.packages.find]
include = ["perfagent*"]

[tool.setuptools.package-data]
"perfagent.measure" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
