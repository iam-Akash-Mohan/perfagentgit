# Runtime configuration. Environment variables of the form PERFAGENT_LLM_*
# override anything here; explicit CLI flags override both.
llm:
  provider: cerebras
  model: gpt-oss-120b          # the spec named qwen-3-coder-480b; this account cannot see it
  max_tokens: 8192            # gpt-oss-120b spends its first ~1k output tokens reasoning
  timeout_s: 120
  cassette_dir: .perfagent/cassettes
  offline: false
